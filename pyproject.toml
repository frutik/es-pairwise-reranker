[project]
name = "es-pairwise-reranker"
version = "0.1.0"
description = "An Elasticsearch rerank service that orders search hits by asking TypeSafe Jev which of two documents is more relevant."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic-settings>=2.4",
  "redis>=5.1",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "fakeredis>=2.26",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "ruff>=0.6",
]

[project.scripts]
rerank-eval = "eval.evaluate:main"
wands-load = "eval.wands:main"
wands-judged = "eval.wands:main_judged"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["reranker*", "eval*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
